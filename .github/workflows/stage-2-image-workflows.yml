name: Aahana Stage 2 image workflow checks
on:
  push:
    branches:
      - work/stage-2-image-workflows
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aahana-stage-2-image-workflows
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests and production build
        run: npm run build
