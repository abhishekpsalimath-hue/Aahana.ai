name: Aahana agent worker Phase B checks
on:
  pull_request:
    paths:
      - ".github/workflows/agent-worker-phase-b.yml"
      - "src/app/api/internal/agent-worker/**"
      - "src/lib/operations/agent-worker.*"
  push:
    branches:
      - feat/aahana-agent-worker-phase-b
      - fix/agent-worker-provider-credential-boundary
      - fix/agent-worker-requeue-on-caller-cancel
      - fix/agent-worker-abort-context-reads
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aahana-agent-worker-phase-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Build application
        run: npm run build
