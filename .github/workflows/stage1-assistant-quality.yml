name: Stage 1 assistant quality checks
on:
  pull_request:
    branches:
      - main
      - stage-1/assistant-quality-foundation
      - stage-1/five-dimension-evaluation
    paths:
      - "src/lib/ai/assistant-evaluation.*"
      - "src/lib/learning/quiz-bank-policy.*"
      - "src/lib/learning/learner-progress-policy.*"
      - "src/app/interaction-accessibility.test.mjs"
      - "src/app/mode-tabs-accessibility.test.mjs"
      - "src/app/globals.css"
      - "src/app/assistant-workspace.jsx"
      - "src/app/learn/learning-studio.css"
      - "docs/stage-1-assistant-quality-foundation.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/stage1-assistant-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage1-assistant-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete automated test suite
        run: npm test
      - name: Build application
        run: npm run build
