name: Isolated workspace guards

on:
  pull_request:
    paths:
      - "src/app/api/build/**"
      - "src/lib/build/**"
      - "src/app/assistant-workspace*"
      - "src/app/globals.css"
      - ".github/workflows/isolated-workspace-guards.yml"
      - "package.json"
  push:
    branches:
      - work/isolated-workspace-v2
      - fix/build-route-stop-storage-reads-on-disconnect
    paths:
      - "src/app/api/build/**"
      - "src/lib/build/**"
      - "src/app/assistant-workspace*"
      - ".github/workflows/isolated-workspace-guards.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --test src/lib/build/*.test.mjs
      - run: npm run lint
      - run: npm run build
