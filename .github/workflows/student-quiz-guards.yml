name: Aahana Student Mode journey guards

on:
  push:
    branches:
      - "fix/aahana-student-joyful-journey"
      - "feat/aahana-student-cinematic-exam-readiness"
    paths:
      - "src/app/api/chat/route.js"
      - "src/app/learn/learning-studio.jsx"
      - "src/app/learn/interactive-3d-world.jsx"
      - "src/lib/learning/student-cinematic-exam-readiness.test.mjs"
      - "src/app/learn/learning-studio.css"
      - "src/lib/learning/student-journey-ui.test.mjs"
      - "src/lib/learning/learning-studio-policy.test.mjs"
      - "src/lib/learning/quiz-bank-policy.*"
      - "src/app/learn/native-image-studio.jsx"
      - "src/app/learn/creator-studio.css"
      - "src/lib/studio/image-engine.*"
      - "src/app/learn/native-motion-studio.jsx"
      - "src/lib/studio/motion-engine.*"
      - ".github/workflows/student-quiz-guards.yml"
  pull_request:
    paths:
      - "src/app/api/chat/route.js"
      - "src/app/learn/learning-studio.jsx"
      - "src/app/learn/learning-studio.css"
      - "src/lib/learning/quiz-bank-policy.*"
      - "src/app/learn/native-image-studio.jsx"
      - "src/app/learn/creator-studio.css"
      - "src/lib/studio/image-engine.*"
      - "src/app/learn/native-motion-studio.jsx"
      - "src/lib/studio/motion-engine.*"
      - "src/lib/learning/learning-studio-policy.test.mjs"
      - "src/lib/learning/student-journey-ui.test.mjs"
      - ".github/workflows/student-quiz-guards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-quiz-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Student Mode journey and quiz tests
        run: node --test src/lib/learning/learning-studio-policy.test.mjs src/lib/learning/quiz-bank-policy.test.mjs src/lib/learning/student-journey-ui.test.mjs src/lib/learning/student-cinematic-exam-readiness.test.mjs src/lib/studio/image-engine.test.mjs src/lib/studio/motion-engine.test.mjs
      - name: Syntax-check learning API
        run: node --check src/app/api/chat/route.js
