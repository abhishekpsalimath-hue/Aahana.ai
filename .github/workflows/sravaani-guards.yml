name: SraVaani request-guard tests

on:
  pull_request:
    paths:
      - "services/sravaani-asr/**"
      - ".github/workflows/sravaani-guards.yml"
      - "src/lib/voice/sravaani-asr-provider.*"
      - "src/lib/voice/README.md"
      - "src/app/api/voice/transcribe/route.js"
      - "src/app/api/voice/speech/route.js"
      - "src/app/api/chat/route.js"
      - "src/app/api/images/generate/route.js"
      - "src/lib/ai/image-intent-policy.*"
      - "src/app/api/build/**"
      - "src/app/api/files/**"
      - "src/app/assistant-workspace.jsx"
      - "src/app/learn/**"
      - "src/lib/learning/**"
      - "src/lib/build/**"
      - "src/lib/voice/audio-wav.*"
      - "src/lib/voice/locale-detection.*"
      - "src/lib/voice/locale-support.*"
      - "src/lib/voice/speech-fallback-policy.*"
  push:
    branches:
      - "feat/aahana-voice-runtime-adapters"
      - "feat/aahana-learning-studio"
      - "feat/aahana-safe-build-engine"
      - "feat/aahana-assistant-core"
    paths:
      - "services/sravaani-asr/**"
      - ".github/workflows/sravaani-guards.yml"
      - "src/lib/voice/sravaani-asr-provider.*"
      - "src/lib/voice/README.md"
      - "src/app/assistant-workspace.jsx"
      - "src/app/api/voice/transcribe/route.js"
      - "src/app/api/voice/speech/route.js"
      - "src/app/api/voice/capabilities/route.js"
      - "src/app/api/chat/route.js"
      - "src/app/api/images/generate/route.js"
      - "src/lib/ai/image-intent-policy.*"
      - "src/app/api/build/**"
      - "src/app/api/files/**"
      - "src/app/learn/**"
      - "src/lib/learning/**"
      - "src/lib/build/**"
      - "src/lib/voice/audio-wav.*"
      - "src/lib/voice/locale-detection.*"
      - "src/lib/voice/locale-support.*"
      - "src/lib/voice/speech-fallback-policy.*"

permissions:
  contents: read

jobs:
  request-guards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sravaani-asr
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free request guard tests
        run: python -m unittest -v test_request_validation.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run SraVaani provider adapter tests
        run: node --test ../../src/lib/voice/sravaani-asr-provider.test.mjs
      - name: Test browser WAV encoder
        run: node --test ../../src/lib/voice/audio-wav.test.mjs
      - name: Test multilingual locale detection and coverage
        run: node --test ../../src/lib/voice/locale-detection.test.mjs ../../src/lib/voice/locale-support.test.mjs
      - name: Test multilingual chat response policy
        run: node --test ../../src/lib/voice/chat-language-policy.test.mjs
      - name: Test device speech fallback policy
        run: node --test ../../src/lib/voice/speech-fallback-policy.test.mjs
      - name: Test Aahana Learning Studio policy and integration
        run: node --test ../../src/lib/learning/learning-studio-policy.test.mjs
      - name: Test private learning journey memory
        run: node --test ../../src/lib/learning/learning-memory.test.mjs
      - name: Test relevant project source selection
        run: node --test ../../src/lib/learning/project-source-policy.test.mjs
      - name: Test unified Creator Studio cloud workspace
        run: node --test ../../src/lib/learning/creator-workspace-model.test.mjs ../../src/lib/studio/project-engine.test.mjs
      - name: Syntax-check authenticated learning journey API
        run: node --check ../../src/app/api/learning-journey/route.js
      - name: Syntax-check authenticated transcription route
        run: node --check ../../src/app/api/voice/transcribe/route.js
      - name: Syntax-check authenticated speech synthesis route
        run: node --check ../../src/app/api/voice/speech/route.js
      - name: Syntax-check authenticated voice capabilities route
        run: node --check ../../src/app/api/voice/capabilities/route.js
      - name: Test isolated build sandbox policy
        run: node --test ../../src/lib/build/sandbox-policy.test.mjs
      - name: Test owner-controlled release policy
        run: node --test ../../src/lib/build/release-policy.test.mjs
      - name: Test project dependency and contract analysis
        run: node --test ../../src/lib/build/project-dependency-policy.test.mjs
      - name: Test owner-approved code change proposals
        run: node --test ../../src/lib/build/change-proposal-policy.test.mjs ../../src/lib/build/proposal-snapshot-policy.test.mjs ../../src/lib/build/proposal-draft-policy.test.mjs
      - name: Test AI proposal generation validation
        run: node --test ../../src/lib/build/proposal-generation-policy.test.mjs
      - name: Test isolated proposal workspace preparation
        run: node --test ../../src/lib/build/proposal-workspace-policy.test.mjs
      - name: Test workspace build and test planning
        run: node --test ../../src/lib/build/workspace-check-plan-policy.test.mjs
      - name: Test explicit workspace execution approval
        run: node --test ../../src/lib/build/workspace-approval-policy.test.mjs
      - name: Test natural-language image generation intent
        run: node --test ../../src/lib/ai/image-intent-policy.test.mjs
      - name: Test natural-language video generation policy
        run: node --test ../../src/lib/ai/video-generation-policy.test.mjs
      - name: Test founder-only private workspace access
        run: node --test ../../src/lib/auth/founder-access-policy.test.mjs
      - name: Syntax-check authenticated image generation API
        run: node --check ../../src/app/api/images/generate/route.js
      - name: Test server-only AI provider configuration
        run: node --test ../../src/lib/ai/provider-policy.test.mjs
      - name: Test structured isolated build diagnostics
        run: node --test ../../src/lib/build/build-diagnostic-policy.test.mjs
      - name: Test diagnostic source context
        run: node --test ../../src/lib/build/diagnostic-source-context.test.mjs
      - name: Test isolated Build Engine orchestration
        run: node --test ../../src/lib/build/build-engine.test.mjs
      - name: Syntax-check isolated build engine and policies
        run: node --check ../../src/lib/build/sandbox-policy.mjs && node --check ../../src/lib/build/release-policy.mjs && node --check ../../src/lib/build/change-proposal-policy.mjs && node --check ../../src/lib/build/proposal-snapshot-policy.mjs && node --check ../../src/lib/ai/provider-policy.mjs && node --check ../../src/lib/build/proposal-draft-policy.mjs && node --check ../../src/lib/build/proposal-generation-policy.mjs && node --check ../../src/lib/build/proposal-workspace-policy.mjs && node --check ../../src/lib/build/workspace-check-plan-policy.mjs && node --check ../../src/lib/build/workspace-approval-policy.mjs && node --check ../../src/lib/build/build-diagnostic-policy.mjs && node --check ../../src/lib/build/diagnostic-source-context.mjs && node --check ../../src/lib/build/project-dependency-policy.mjs && node --check ../../src/lib/ai/video-generation-policy.mjs && node --check ../../src/app/api/videos/generate/route.js && node --check ../../src/lib/build/build-engine.mjs && node --check ../../src/app/api/build/run/route.js
      - name: Syntax-check private founder workspace APIs
        run: node --check ../../src/lib/auth/founder-session.js && node --check ../../src/app/api/founder-access/route.js && node --check ../../src/app/api/operations/route.js && node --check ../../src/app/api/operations/execute/route.js && node --check ../../src/app/api/executives/brief/route.js
      - name: Syntax-check chat route
        run: node --check ../../src/app/api/chat/route.js
      - name: Syntax-check authenticated project build route
        run: node --check ../../src/app/api/build/project/route.js
      - name: Syntax-check authenticated proposal review route
        run: node --check ../../src/app/api/build/proposal/route.js
      - name: Syntax-check authenticated AI proposal draft route
        run: node --check ../../src/app/api/build/draft/route.js
      - name: Syntax-check project source selection policy
        run: node --check ../../src/lib/learning/project-source-policy.mjs
      - name: Syntax-check authenticated Build Engine status route
        run: node --check ../../src/app/api/build/status/route.js
      - name: Syntax-check authenticated file API
        run: node --check ../../src/app/api/files/route.js
