name: Aahana image provider output validation

on:
  push:
    branches:
      - fix/image-provider-output-validation
    paths:
      - "src/app/api/images/generate/route.js"
      - "src/app/api/images/edit/route.js"
      - "src/lib/creative/image-provider.mjs"
      - "src/lib/creative/image-provider.test.mjs"
      - ".github/workflows/image-provider-validation.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: aahana-image-provider-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full tests and production build
        run: npm run build
