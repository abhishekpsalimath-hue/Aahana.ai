name: Aahana isolated code proposal worker

on:
  workflow_dispatch:
    inputs:
      task:
        description: "One focused engineering improvement for Aahana"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aahana-isolated-proposal-worker
  cancel-in-progress: false

jobs:
  propose:
    if: github.actor == 'abhishekpsalimath-hue' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm install --no-audit --no-fund

      - name: Ask Aahana for a bounded proposal
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          AAHANA_PROPOSAL_TASK: ${{ inputs.task }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/aahana-isolated-proposal.mjs

      - name: Run full tests and production build
        run: npm run build

      - name: Mint narrowly scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AAHANA_GITHUB_APP_ID }}
          private-key: ${{ secrets.AAHANA_GITHUB_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open a draft pull request for owner review
        uses: actions/github-script@v7
        env:
          PROPOSAL_PATH: aahana-proposal.json
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require("fs");
            const proposal = JSON.parse(fs.readFileSync(process.env.PROPOSAL_PATH, "utf8"));
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = await github.rest.git.getRef({ owner, repo, ref: "heads/main" });
            if (base.data.object.sha !== proposal.baseSha) {
              core.setFailed("The main branch changed during validation. Re-run the isolated proposal against the latest main.");
              return;
            }
            const baseSha = base.data.object.sha;
            const branch = `aahana/proposal-${context.runId}-${context.runAttempt}`;
            const blobs = [];
            for (const file of proposal.files) {
              const blob = await github.rest.git.createBlob({
                owner, repo, content: file.content, encoding: "utf-8"
              });
              blobs.push({ path: file.path, mode: "100644", type: "blob", sha: blob.data.sha });
            }
            const tree = await github.rest.git.createTree({
              owner, repo, base_tree: baseSha, tree: blobs
            });
            const commit = await github.rest.git.createCommit({
              owner, repo,
              message: `Aahana proposal: ${proposal.title}`,
              tree: tree.data.sha,
              parents: [baseSha],
            });
            await github.rest.git.createRef({
              owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha
            });
            const pr = await github.rest.pulls.create({
              owner, repo,
              title: `[Aahana proposal] ${proposal.title}`,
              head: branch,
              base: "main",
              draft: true,
              body: [
                "## Aahana's proposed improvement",
                proposal.summary,
                "",
                "## Verification",
                "- Generated in an isolated GitHub-hosted runner.",
                "- Exact search/replace patches were restricted to the approved source inventory.",
                "- Full project tests and production build passed before this draft PR was created.",
                "- This is a proposal only; no merge or deployment was performed.",
                "",
                "## Owner review required",
                "Please inspect every changed line and run any additional checks before accepting.",
                "",
                `Base commit: \`${baseSha}\``,
                `Proposal commit: \`${commit.data.sha}\``,
              ].join("\n"),
            });
            core.notice(`Created draft PR #${pr.data.number}: ${pr.data.html_url}`);
