name: Media generation guards

on:
  pull_request:
    paths:
      - "src/app/api/videos/**"
      - "src/lib/ai/video-generation-policy.*"
      - "src/lib/ai/media-route-contract.test.mjs"
      - ".github/workflows/media-generation-guards.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - feat/video-generation-and-distinctive-typography
    paths:
      - "src/app/api/videos/**"
      - "src/lib/ai/video-generation-policy.*"
      - "src/lib/ai/media-route-contract.test.mjs"
      - ".github/workflows/media-generation-guards.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: media-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test src/lib/ai/video-generation-policy.test.mjs src/lib/ai/media-route-contract.test.mjs
      - run: npm run lint
      - run: npm run build
