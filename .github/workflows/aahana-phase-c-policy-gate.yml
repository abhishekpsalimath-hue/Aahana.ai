name: Aahana Phase C policy gate checks
on:
  pull_request:
    branches:
      - feat/aahana-agent-worker-phase-b
      - feat/aahana-autonomous-development-phase-c-policy-gate
      - feat/aahana-phase-c-policy-hardening
      - feat/phase-c-trusted-github-evidence
      - fix/phase-c-detect-renamed-protected-paths
      - fix/phase-c-evidence-invalid-criteria
      - fix/phase-c-github-api-timeouts
      - fix/phase-c-verify-diff-tree-statuses
      - fix/phase-c-reject-ambiguous-diff-entries
      - fix/phase-c-require-trusted-check-app
    paths:
      - "src/lib/operations/autonomous-policy.*"
      - "src/lib/operations/autonomous-github-evidence.*"
      - "src/lib/operations/github-app-client.*"
      - "src/lib/operations/autonomous-review.*"
      - "docs/aahana-github-app-readonly-integration.md"
      - "package.json"
      - ".github/workflows/aahana-phase-c-policy-gate.yml"
  push:
    branches:
      - feat/aahana-autonomous-development-phase-c-policy-gate
      - feat/aahana-phase-c-policy-hardening
      - feat/phase-c-trusted-github-evidence
      - feat/phase-c-github-app-readonly-client
      - feat/phase-c-github-app-minimum-permissions
      - fix/phase-c-detect-renamed-protected-paths
      - fix/phase-c-evidence-invalid-criteria
      - fix/phase-c-github-api-timeouts
      - fix/phase-c-reject-ambiguous-diff-entries
      - fix/phase-c-require-trusted-check-app
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aahana-phase-c-policy-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run policy tests
        run: node --test src/lib/operations/autonomous-policy.test.mjs src/lib/operations/autonomous-github-evidence.test.mjs src/lib/operations/github-app-client.test.mjs src/lib/operations/autonomous-review.test.mjs
      - name: Run full test suite
        run: npm test
      - name: Build application
        run: npm run build
